# Render Blueprint: deploys the NutriAI API (nutrition-app/server).
# Render → New → Blueprint → pick this repository and branch.
services:
  - type: web
    name: nutri-ai-api
    runtime: node
    plan: free
    rootDir: nutrition-app
    buildCommand: cd server && npm ci --omit=dev
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false # entered by you in the Render dashboard
      - key: APP_API_TOKEN
        generateValue: true # random secret; copy it into mobile/.env
      - key: AI_MODEL
        value: claude-opus-5-5
