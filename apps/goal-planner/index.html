<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Планер целей</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one mobile-first column (max 760px), fixed bottom tab bar, "+" floating above it; sheets slide up from the bottom. Dark only, per spec. */
:root{
  --bg:#0E0E10; --card:#18181B; --raise:#232327; --line:#2E2E33;
  --fg:#F2F2F5; --mute:#9A9AA3; --acc:#5B8CFF; --on-acc:#0E0E10;
  --ok:#30D158; --warn:#FFD60A; --bad:#FF453A;
  --font:'Inter',-apple-system,'SF Pro Text','Roboto',system-ui,sans-serif;
  --r:14px; --nav-h:64px;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font:15px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:650}
h3{font-size:15px;font-weight:600}
.mute{color:var(--mute)}
.small{font-size:13px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.top .ttl{min-width:0}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mute);display:inline-block}
.sync.db i{background:var(--ok)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn:disabled{opacity:.35}
.card{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid transparent}
.card.btn{text-align:left;width:100%;border:1px solid transparent}
.card.btn:hover{border-color:var(--line)}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.pct{font-weight:750}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.hero .facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.hero .facts b{display:block;font-size:18px;font-weight:700}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-none{color:var(--mute)}
.bg-ok{background:var(--ok)!important} .bg-warn{background:var(--warn)!important} .bg-bad{background:var(--bad)!important} .bg-none{background:var(--mute)!important}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--raise);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px}
.goal .gt{font-weight:600;line-height:1.3}
.goal .gp{font-size:24px;font-weight:800;letter-spacing:-.02em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:550;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.chip b{font-weight:750}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dw{font-size:11px;color:var(--mute);text-align:center;padding-bottom:2px;font-weight:600}
.cell{background:var(--card);border-radius:10px;min-height:58px;padding:6px;display:flex;flex-direction:column;gap:4px;border:1px solid transparent;text-align:left}
.cell.pad{background:transparent}
.cell.today{border-color:var(--acc)}
.cell .n{font-size:13px;font-weight:650}
.cell .cnt{font-size:11px;color:var(--mute);margin-top:auto}
.cell .mini{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.cell .mini i{display:block;height:100%}
.cell .ev{width:6px;height:6px;border-radius:50%;background:var(--acc);display:inline-block}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:12px;padding:10px 12px}
.task.done .tt{color:var(--mute);text-decoration:line-through}
.task.cancelled{opacity:.55}
.tk{width:24px;height:24px;border-radius:7px;border:2px solid var(--mute);background:transparent;flex:none;display:grid;place-items:center;margin-top:1px;padding:0}
.tk.on{background:var(--ok);border-color:var(--ok)}
.tk.on::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--on-acc);border-bottom:2.5px solid var(--on-acc);transform:rotate(-45deg) translate(1px,-1px)}
.tk.part{border-color:var(--acc)}
.tbody{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.tt{font-weight:550;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--mute);margin-top:3px;align-items:center}
.flag{color:var(--bad);font-weight:650}
.time{font-weight:650;color:var(--fg);font-size:13px;min-width:42px}
.warnbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--raise);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--acc)}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;box-shadow:0 0 0 4px var(--bg)}
.fab svg{width:26px;height:26px}
#sheet{position:fixed;inset:0;z-index:40}
#sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);border:0;width:100%;cursor:default}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92%;overflow:auto;background:var(--raise);border-radius:20px 20px 0 0;padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@media (prefers-reduced-motion:reduce){#sheet .panel{animation:none}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.x{background:var(--card);border:0;width:34px;height:34px;border-radius:10px;flex:none;font-size:20px;line-height:1;color:var(--mute)}
form.f{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;color:var(--mute);font-weight:600}
.f input,.f select,.f textarea,.inp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.btnp{background:var(--acc);color:var(--on-acc);border:0;border-radius:12px;padding:12px 16px;font-weight:700}
.btn2{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}
.btn2.danger{color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.tabs button.on{background:var(--raise);color:var(--fg)}
.tabs.money button.on.inc{color:var(--ok)}
.tabs.money button.on.exp{color:var(--bad)}
.hint{font-size:12px;color:var(--mute)}
.tree .key{background:var(--card);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sub{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.checks{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.chk{display:flex;gap:8px;align-items:center;background:none;border:0;padding:3px 0;text-align:left;font-size:13px;color:var(--fg)}
.chk .tk{width:18px;height:18px;border-radius:5px;margin:0}
.chk .tk.on::after{width:8px;height:5px;border-width:0 0 2px 2px}
.chk.on span{color:var(--mute);text-decoration:line-through}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800;letter-spacing:-.02em}
.chart{width:100%;height:auto;display:block}
.evt{display:flex;gap:12px;align-items:center}
.evt .when{width:54px;flex:none;text-align:center;background:var(--raise);border-radius:10px;padding:6px 0}
.evt .when b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.evt .when span{font-size:11px;color:var(--mute)}
.empty{color:var(--mute);font-size:14px;padding:16px;border:1px dashed var(--line);border-radius:12px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:center}
.money3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.money3 .card{padding:12px}
.money3 b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere;line-height:1.2;margin-top:2px}
.op{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:10px 12px;width:100%;border:0;text-align:left}
.op .amt{font-weight:750;white-space:nowrap}
.daylbl{font-size:12px;color:var(--mute);font-weight:600;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (max-width:420px){.big{font-size:38px}.ring{width:84px;height:84px}.hero .facts b{font-size:16px}.cell{min-height:52px;padding:5px}.money3 b{font-size:16px}}
</style>

<div id="app"></div>
<button class="fab" data-a="add" aria-label="Добавить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="nav"><div class="in" id="nav"></div></nav>
<div id="sheet" hidden><button class="scrim" data-a="close" aria-label="Закрыть"></button><div class="panel" role="dialog" aria-modal="true" id="panel"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ===================== helpers ===================== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const dow=s=>(pd(s).getDay()+6)%7;
const TODAY=iso(new Date());
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const DW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DWF=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dShort=s=>pd(s).getDate()+' '+MS[pd(s).getMonth()];
const dLong=s=>pd(s).getDate()+' '+MG[pd(s).getMonth()];
const fp=p=>{if(p==null||isNaN(p))return '—';const r=Math.round(p*10)/10;return String(r).replace('.',',')+'%'};
const fpi=p=>p==null||isNaN(p)?'—':Math.round(p)+'%';
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c};
const monthBounds=ym=>{const[y,m]=ym.split('-').map(Number);return [`${y}-${pad(m)}-01`,iso(new Date(y,m,0))]};
const ymTitle=ym=>{const[y,m]=ym.split('-').map(Number);return MN[m-1]+' '+y};
const ymShift=(ym,n)=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const SPHERE_COLORS=['#64A8FF','#BF7AF0','#FF9F5A','#4FD1C5','#E58FB5','#A3B1FF','#D4C17A'];
const EXP_CATS=['Еда','Транспорт','Жильё','Связь и подписки','Здоровье','Одежда','Развлечения','Работа и реклама','Долги и кредиты','Другое'];
const INC_CATS=['Клиенты','Зарплата','Подработка','Возврат долга','Другое'];

/* ===================== state & storage ===================== */
function emptyState(){
  const [start,end]=monthBounds(TODAY.slice(0,7));
  return {
    v:2,
    month:{start,end,focus:''},
    spheres:['Работа','Клиенты','Финансы','Здоровье','Личное'].map((name,i)=>({id:uid(),name,color:SPHERE_COLORS[i]})),
    goals:[],keyTasks:[],subtasks:[],events:[],
    finance:{currency:'₸',entries:[],plans:{}},
  };
}
/** Пример из первой версии заменяется пустым планом; старые сохранения получают раздел финансов. */
function normalize(x){
  if(!x||!x.month||x.demo)return emptyState();
  x.v=2;
  x.finance=x.finance||{currency:'₸',entries:[],plans:{}};
  x.finance.plans=x.finance.plans||{};
  for(const k of ['spheres','goals','keyTasks','subtasks','events'])x[k]=x[k]||[];
  delete x.archive;delete x.settings;
  return x;
}
const LS_KEY='goal-planner-v1';
let S=null;
try{const raw=localStorage.getItem(LS_KEY);if(raw)S=JSON.parse(raw)}catch(e){}
S=normalize(S);
let store={kind:'local',ref:null,busy:false,again:false};
let saveTimer=null;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,500)}
async function flush(){
  const json=JSON.stringify(S);
  try{localStorage.setItem(LS_KEY,json)}catch(e){}
  if(store.kind!=='db')return;
  if(store.busy){store.again=true;return}
  store.busy=true;
  try{await store.ref.set({json,updatedAt:Date.now()});setSync('db')}catch(e){setSync('err')}
  store.busy=false;
  if(store.again){store.again=false;flush()}
}
let syncState='local';
function setSync(k){syncState=k;const el=$('#sync');if(el)el.outerHTML=syncHTML()}
function syncHTML(){
  const t={local:'Сохраняется на этом устройстве',db:'Сохранено в вашем аккаунте',err:'Не удалось сохранить в аккаунт',load:'Подключаю аккаунт…'}[syncState];
  return `<span id="sync" class="sync ${syncState==='db'?'db':''}"><i></i>${t}</span>`;
}
async function initStore(){
  let C=window.claude;
  for(let i=0;i<10&&!C?.use;i++){await new Promise(r=>setTimeout(r,150));C=window.claude}
  if(!C?.use)return;
  setSync('load');
  try{
    const [db,user]=await Promise.all([C.use('db'),C.use('user')]);
    if(!db||!user){setSync('local');return}
    const id=await user.id();
    if(!id){setSync('local');return}
    const ref=db.doc('data/users/'+id+'/planner');
    const snap=await Promise.race([ref.get(),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),10000))]);
    store={kind:'db',ref,busy:false,again:false};
    let wasDemo=false;
    if(snap.exists){
      const d=snap.data();
      if(d&&typeof d.json==='string'){try{const x=JSON.parse(d.json);wasDemo=!!x.demo;S=normalize(x)}catch(e){}}
      setSync('db');render();renderSheet();
      if(wasDemo)flush();
    }else{setSync('db');flush()}
  }catch(e){setSync('local')}
}

/* ===================== calculations ===================== */
const live=x=>x&&x.status!=='cancelled';
const isDone=(x,at)=>x.status==='done'&&(!at||!x.doneAt||x.doneAt<=at);
function wavg(items){let W=0,P=0;for(const[w,p]of items){W+=w;P+=w*p}return W?P/W:0}
const goalById=id=>S.goals.find(g=>g.id===id);
const keyById=id=>S.keyTasks.find(k=>k.id===id);
const subById=id=>S.subtasks.find(s=>s.id===id);
const sphereById=id=>S.spheres.find(s=>s.id===id)||{name:'Без сферы',color:'#9A9AA3'};
const subsOf=k=>S.subtasks.filter(s=>s.keyTaskId===k.id&&live(s));
const keysOf=g=>S.keyTasks.filter(k=>k.goalId===g.id&&live(k));
const goalOfSub=s=>{const k=s.keyTaskId&&keyById(s.keyTaskId);return k?goalById(k.goalId):null};
const liveGoals=()=>S.goals.filter(live);
function subPct(s,at){
  if(isDone(s,at))return 100;
  const c=s.checks||[];
  if(!c.length)return 0;
  return c.filter(k=>k.done&&(!at||!k.doneAt||k.doneAt<=at)).length/c.length*100;
}
function keyPct(k,at){const ss=subsOf(k);return ss.length?wavg(ss.map(s=>[1,subPct(s,at)])):(isDone(k,at)?100:0)}
const factOf=(g,at)=>(g.log||[]).filter(e=>!at||e.date<=at).reduce((a,e)=>a+e.delta,0);
function goalPct(g,at){
  if(g.type==='number')return g.target>0?Math.min(100,Math.max(0,factOf(g,at))/g.target*100):0;
  return wavg(keysOf(g).map(k=>[k.weight||1,keyPct(k,at)]));
}
const monthPct=at=>wavg(liveGoals().map(g=>[g.weight||1,goalPct(g,at)]));
function rangeStat(a,b){
  const ss=S.subtasks.filter(s=>live(s)&&s.date&&s.date>=a&&s.date<=b);
  const d=ss.filter(s=>s.status==='done').length;
  return {n:ss.length,d,p:ss.length?d/ss.length*100:null};
}
const monthDays=()=>diff(S.month.start,S.month.end)+1;
function elapsedPct(){const n=monthDays();const p=Math.min(n,Math.max(0,diff(S.month.start,TODAY)+1));return p/n*100}
function goalPace(g){
  if(g.type==='number'){const e=elapsedPct();return e?goalPct(g)/e*100:null}
  const items=[];
  for(const k of keysOf(g)){const ss=subsOf(k);if(ss.length)ss.forEach(s=>s.date&&items.push(s));else if(k.due)items.push({status:k.status,date:k.due})}
  const due=items.filter(x=>x.date<TODAY||(x.date===TODAY&&x.status==='done'));
  if(!due.length)return null;
  return due.filter(x=>x.status==='done').length/due.length*100;
}
function monthPace(){if(!liveGoals().length)return null;const e=elapsedPct();return e?monthPct()/e*100:null}
const paceCls=p=>p==null?'none':p>=90?'ok':p>=70?'warn':'bad';
const paceText=p=>p==null?'Пока без темпа':p>=90?'В графике':p>=70?'Небольшое отставание':'Отставание';
const dayList=(a,b)=>{const r=[];for(let d=a;d<=b;d=addDays(d,1))r.push(d);return r};
const inMonth=d=>d>=S.month.start&&d<=S.month.end;
const monthTitle=()=>ymTitle(S.month.start.slice(0,7));
const fmtDur=m=>{m=+m||0;const h=Math.floor(m/60),mm=m%60;return (h?h+' ч':'')+(h&&mm?' ':'')+(mm?mm+' мин':'')||'0 мин'};

/* finance */
const money=n=>{const r=Math.round((+n||0)*100)/100;return r.toLocaleString('ru-RU',{maximumFractionDigits:2})+' '+(S.finance.currency||'')};
const entriesOf=ym=>S.finance.entries.filter(e=>e.date.slice(0,7)===ym);
function finStat(ym){
  const es=entriesOf(ym);
  const inc=es.filter(e=>e.type==='income').reduce((a,e)=>a+e.amount,0);
  const exp=es.filter(e=>e.type==='expense').reduce((a,e)=>a+e.amount,0);
  return {inc,exp,bal:inc-exp,es};
}
function byCat(es,type){
  const m={};es.filter(e=>e.type===type).forEach(e=>{m[e.category]=(m[e.category]||0)+e.amount});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function catList(type){
  const base=type==='income'?INC_CATS:EXP_CATS;
  const used=[...new Set(S.finance.entries.filter(e=>e.type===type).map(e=>e.category))];
  return [...used,...base.filter(c=>!used.includes(c))];
}

/* ===================== mutations ===================== */
function commit(msg){save();render();renderSheet();if(msg)toast(msg)}
function setSubStatus(s,st){s.status=st;s.doneAt=st==='done'?TODAY:null;syncKeyStatus(s.keyTaskId)}
function syncKeyStatus(kid){
  const k=kid&&keyById(kid);if(!k||k.status==='cancelled')return;
  const ss=subsOf(k);if(!ss.length)return;
  const p=keyPct(k);
  k.status=p>=100?'done':p>0?'doing':'todo';
  k.doneAt=k.status==='done'?(k.doneAt||TODAY):null;
}
function moveSub(s,date){
  if(s.date&&date!==s.date){s.moves=(s.moves||0)+1;if(s.status!=='done')s.status='moved'}
  s.date=date;
}

}
function topbar(title,sub){

function goalCard(g){
  const p=goalPct(g),pc=goalPace(g),cls=paceCls(pc),sp=sphereById(g.sphereId);
  const ks=keysOf(g);
  const detail=g.type==='number'?`${factOf(g)} из ${g.target} ${esc(g.unit||'')}`:(ks.length?`${ks.filter(k=>keyPct(k)>=100).length} из ${ks.length} шагов`:'добавьте шаги');
  return `<button class="card btn goal stack" data-a="goal" data-id="${g.id}" style="gap:10px">
    <div class="row between"><span class="pill"><span class="dot" style="background:${sp.color}"></span>${esc(sp.name)}</span>${g.weight>1?`<span class="small mute">вес ${g.weight}</span>`:''}</div>

    <div class="row between" style="align-items:flex-end"><span class="gp c-${cls}">${fp(p)}</span><span class="small mute" style="text-align:right">${detail}</span></div>

    <div class="small c-${cls}">${paceText(pc)}${pc!=null?' · темп '+fpi(pc):''}</div>

function eventRow(e){
  const g=e.goalId&&goalById(e.goalId),left=diff(TODAY,e.date);

/* ===================== sheets ===================== */
let stack=[];
function openSheet(fn){stack.push(fn);renderSheet();const p=$('#panel');p.scrollTop=0;setTimeout(()=>{const f=p.querySelector('[autofocus]');if(f)f.focus()},60)}
function closeSheet(){stack.pop();renderSheet()}
function closeAll(){stack=[];renderSheet()}
function renderSheet(){
  const sh=$('#sheet');
  if(!stack.length){sh.hidden=true;return}
  const html=stack[stack.length-1]();
  if(html==null){stack.pop();return renderSheet()}
  const p=$('#panel'),y=p.scrollTop;
  p.innerHTML='<div class="grab"></div>'+html;sh.hidden=false;p.scrollTop=y;
}
const head=(t,sub)=>`<div class="sheethead"><div class="grow"><h2>${t}</h2>${sub?`<div class="small mute" style="margin-top:3px">${sub}</div>`:''}</div><button class="x" data-a="close" aria-label="Закрыть">×</button></div>`;
function linkOptions(sel){
  let o=`<option value="" ${!sel?'selected':''}>Вне целей</option>`;
  for(const g of liveGoals()){const ks=keysOf(g);if(!ks.length)continue;o+=`<optgroup label="${esc(g.title)}">${ks.map(k=>`<option value="${k.id}" ${sel===k.id?'selected':''}>${esc(k.title)}</option>`).join('')}</optgroup>`}
  return o;
}

function chartSVG(g){
  const days=dayList(S.month.start,S.month.end),n=days.length,W=320,H=130,L=34,R=8,T=10,B=22;
  const x=i=>L+(W-L-R)*i/(n-1),y=p=>T+(H-T-B)*(1-p/100);
  const until=days.filter(d=>d<=TODAY);
  const pts=until.map((d,i)=>`${x(i).toFixed(1)},${y(goalPct(g,d)).toFixed(1)}`).join(' ');
  const last=until.length-1,lp=last>=0?goalPct(g,until[last]):0;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Прогресс цели по дням">
    ${[0,50,100].map(p=>`<line x1="${L}" x2="${W-R}" y1="${y(p)}" y2="${y(p)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(p)+4}" fill="var(--mute)" font-size="10" text-anchor="end">${p}%</text>`).join('')}
    <line x1="${x(0)}" y1="${y(0)}" x2="${x(n-1)}" y2="${y(100)}" stroke="var(--mute)" stroke-width="1" stroke-dasharray="3 4"/>
    ${pts?`<polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(last)}" cy="${y(lp)}" r="4" fill="var(--acc)"/>`:''}
    <text x="${L}" y="${H-6}" fill="var(--mute)" font-size="10">${dShort(days[0])}</text>
    <text x="${W-R}" y="${H-6}" fill="var(--mute)" font-size="10" text-anchor="end">${dShort(days[n-1])}</text>
  </svg><div class="row small mute" style="gap:14px;margin-top:4px"><span class="row" style="gap:6px"><i style="width:14px;height:2px;background:var(--acc);display:inline-block"></i>прогресс</span><span class="row" style="gap:6px"><i style="width:14px;border-top:1px dashed var(--mute);display:inline-block"></i>равномерный план</span></div>`;
}
function goalSheet(id){return()=>{
  const g=goalById(id);if(!g)return null;
  const p=goalPct(g),pc=goalPace(g),cls=paceCls(pc),sp=sphereById(g.sphereId);
  const keys=S.keyTasks.filter(k=>k.goalId===g.id);
  return head(esc(g.title),`${esc(sp.name)} · ${g.type==='number'?'числом':'шагами'}${g.weight>1?' · важность '+g.weight:''}`)+
  `<div class="stack">
    <div class="hero card">${ring(p,cls)}<div class="stack" style="gap:8px"><div class="c-${cls}" style="font-weight:650">${paceText(pc)}${pc!=null?' · '+fpi(pc):''}</div>
      ${g.type==='number'?`<div>Сделано: <b style="font-size:20px">${factOf(g)}</b> из ${g.target} ${esc(g.unit||'')}</div><div class="btnrow"><button class="btn2" data-a="fact" data-id="${g.id}" data-n="-1" aria-label="Минус один">−1</button><button class="btnp" data-a="fact" data-id="${g.id}" data-n="1">+1</button></div>`:`<div class="small mute">Процент собирается из шагов ниже.</div>`}
    </div></div>
    <div class="card">${chartSVG(g)}</div>
    <div class="row between"><h3>Шаги к цели</h3><button class="chip" data-a="addkey" data-g="${g.id}">+ Шаг</button></div>
    <div class="tree stack" style="gap:8px">${keys.length?keys.map(k=>{
      const ss=S.subtasks.filter(s=>s.keyTaskId===k.id).sort((a,b)=>(a.date||'z').localeCompare(b.date||'z'));
      const kp=keyPct(k),canc=k.status==='cancelled';
      return `<div class="key" style="${canc?'opacity:.55':''}">
        <div class="row between" style="align-items:flex-start">
          ${!ss.filter(live).length&&!canc?`<button class="tk ${k.status==='done'?'on':''}" data-a="keytog" data-id="${k.id}" aria-label="Отметить шаг"></button>`:''}
          <div class="grow"><div class="tt">${esc(k.title)}</div><div class="meta">${k.due?`<span>срок ${dShort(k.due)}</span>`:''}${k.weight>1?`<span>важность ${k.weight}</span>`:''}${canc?'<span>отменён</span>':''}</div></div>
          <b class="pct" style="font-size:18px">${canc?'—':fpi(kp)}</b>
        </div>
        ${canc?'':bar(kp)}
        ${ss.map(s=>`<div class="sub"><button class="tk ${s.status==='done'?'on':''}" data-a="tog" data-id="${s.id}" aria-label="Отметить"></button><button class="tbody" data-a="task" data-id="${s.id}"><div class="tt small" style="${s.status==='done'?'color:var(--mute);text-decoration:line-through;':''}${s.status==='cancelled'?'opacity:.5':''}">${esc(s.title)}</div><div class="meta">${s.date?`<span>${dShort(s.date)}</span>`:''}${(s.moves||0)>=3&&s.status!=='done'?'<span class="flag">Застряла</span>':''}</div></button><span class="small" style="font-weight:650">${s.status==='cancelled'?'—':fpi(subPct(s))}</span></div>`).join('')}
        <div class="btnrow"><button class="chip" data-a="add" data-tab="task" data-k="${k.id}">+ Задача</button><button class="chip" data-a="editkey" data-id="${k.id}">Изменить</button><button class="chip" data-a="cankey" data-id="${k.id}">${canc?'Вернуть':'Отменить'}</button></div>
      </div>`}).join(''):'<div class="empty">Разбейте цель на 2–5 крупных шагов, а шаги — на задачи по дням.</div>'}</div>
    <div class="btnrow"><button class="btn2" data-a="editgoal" data-id="${g.id}">Изменить цель</button><button class="btn2 danger" data-a="delgoal" data-id="${g.id}">Удалить цель</button></div>
  </div>`}}
function eventSheet(id){return()=>{

/* ===================== render ===================== */
function render(){
  const r=ui.route;
  const html={month:screenMonth,day:screenDay,goals:screenGoals,money:screenMoney}[r]();
  $('#app').innerHTML=`<div class="wrap">${html}<div style="margin-top:28px;display:flex;justify-content:center">${syncHTML()}</div></div>`;
  $('#nav').innerHTML=[['month','Месяц'],['day','День'],['goals','Цели'],['money','Финансы']].map(([k,v])=>`<button class="${r===k?'on':''}" data-a="nav" data-r="${k}" aria-current="${r===k?'page':'false'}">${I[k]}<span>${v}</span></button>`).join('');
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800)}
function arm(el,text){if(el.dataset.armed)return true;el.dataset.armed='1';el.textContent=text||'Нажмите ещё раз, чтобы удалить';return false}

/* ===================== actions ===================== */
const A={
  nav:d=>{location.hash=d.r},
  goday:d=>{ui.day=d.d;location.hash='day';if(ui.route==='day')render()},
  dy:d=>{ui.day=addDays(curDay(),+d.n);render()},
  fym:d=>{ui.finYm=ymShift(ui.finYm,+d.n);render()},
  tog:d=>{const s=subById(d.id);setSubStatus(s,s.status==='done'?'todo':'done');commit(s.status==='done'?'Выполнено':null)},
  task:d=>openSheet(taskSheet(d.id)),
  goal:d=>openSheet(goalSheet(d.id)),
  event:d=>openSheet(eventSheet(d.id)),
  add:d=>{
    if(!d.tab&&ui.route==='money'){ui.moneyType='expense';openSheet(()=>head('Новая операция')+opForm(null));return}
    ui.addTab=d.tab||(liveGoals().length?'task':'goal');ui.addPre={date:d.d||(ui.route==='day'?curDay():undefined),keyTaskId:d.k};openSheet(addSheet)},
  tab:d=>{ui.addTab=d.t;renderSheet()},
  close:()=>closeSheet(),
  addkey:d=>openSheet(()=>head('Новый шаг',esc(goalById(d.g)?.title))+keyForm(null,{goalId:d.g})),
  check:d=>{const s=subById(d.id),c=s.checks.find(x=>x.id===d.c);c.done=!c.done;c.doneAt=c.done?TODAY:null;
    if(s.checks.every(x=>x.done)&&s.status!=='done')setSubStatus(s,'done');
    else if(!c.done&&s.status==='done')setSubStatus(s,'todo');
    else syncKeyStatus(s.keyTaskId);
    commit()},
  cancel:d=>{const s=subById(d.id);setSubStatus(s,s.status==='cancelled'?'todo':'cancelled');commit()},
  move:d=>openSheet(moveSheet(d.id)),
  moveto:d=>{moveSub(subById(d.id),d.d);closeSheet();commit('Перенесено на '+dShort(d.d))},
  edittask:d=>openSheet(()=>{const s=subById(d.id);return s?head('Изменить задачу')+taskForm(s):null}),
  delsub:(d,el)=>{if(!arm(el))return;const s=subById(d.id);S.subtasks=S.subtasks.filter(x=>x.id!==d.id);syncKeyStatus(s.keyTaskId);closeSheet();commit('Удалено')},
  fact:d=>{const g=goalById(d.id);const n=+d.n;if(n<0&&factOf(g)<=0)return;g.log=g.log||[];g.log.push({date:TODAY,delta:n});commit()},
  keytog:d=>{const k=keyById(d.id);k.status=k.status==='done'?'todo':'done';k.doneAt=k.status==='done'?TODAY:null;commit()},
  cankey:d=>{const k=keyById(d.id);if(k.status==='cancelled'){k.status='todo';syncKeyStatus(k.id)}else k.status='cancelled';commit()},
  editkey:d=>openSheet(()=>{const k=keyById(d.id);return k?head('Изменить шаг')+keyForm(k):null}),
  editgoal:d=>openSheet(()=>{const g=goalById(d.id);return g?head('Изменить цель')+goalForm(g):null}),
  delgoal:(d,el)=>{if(!arm(el,'Удалить вместе с задачами? Нажмите ещё раз'))return;const ks=S.keyTasks.filter(k=>k.goalId===d.id).map(k=>k.id);S.subtasks=S.subtasks.filter(s=>!ks.includes(s.keyTaskId));S.keyTasks=S.keyTasks.filter(k=>k.goalId!==d.id);S.goals=S.goals.filter(g=>g.id!==d.id);S.events.forEach(e=>{if(e.goalId===d.id)e.goalId=''});closeAll();commit('Цель удалена')},
  delevent:(d,el)=>{if(!arm(el))return;S.events=S.events.filter(e=>e.id!==d.id);closeAll();commit('Событие удалено')},
  carry:d=>{const t=addDays(d.d,1);let c=0;S.subtasks.forEach(s=>{if(s.date===d.d&&live(s)&&s.status!=='done'){moveSub(s,t);c++}});commit(`Перенесено на завтра: ${c}`)},
  addop:d=>{ui.moneyType=d.t;openSheet(()=>head('Новая операция')+opForm(null))},
  mtype:d=>{ui.moneyType=d.t;renderSheet()},
  pickcat:d=>{const i=$('#of-cat');if(i){i.value=d.c;$('#of-amount')?.value||$('#of-amount')?.focus()}},
  editop:d=>openSheet(()=>{const o=S.finance.entries.find(e=>e.id===d.id);return o?head(o.type==='income'?'Доход':'Расход')+opForm(o):null}),
  delop:(d,el)=>{if(!arm(el))return;S.finance.entries=S.finance.entries.filter(e=>e.id!==d.id);closeSheet();commit('Операция удалена')},
  plan:()=>openSheet(planSheet),
  settings:()=>openSheet(settingsSheet),
  delsphere:d=>{S.spheres=S.spheres.filter(s=>s.id!==d.id);commit()},
  newmonth:()=>{closeAll();openSheet(newMonthSheet)},
  wipe:(d,el)=>{if(!arm(el,'Удалятся цели, задачи и финансы. Нажмите ещё раз'))return;S=emptyState();ui.day=null;closeAll();commit('Всё очищено')},
};
const F={
  task:(fd,f)=>{
    const id=f.dataset.id,link=fd.get('link');
    const data={title:fd.get('title').trim(),date:fd.get('date'),time:fd.get('time')||'',keyTaskId:link||null};
    if(id){const s=subById(id);const old=s.keyTaskId;if(data.date!==s.date)moveSub(s,data.date);Object.assign(s,data);syncKeyStatus(old);syncKeyStatus(s.keyTaskId);closeSheet();commit('Сохранено');return}
    const checks=(fd.get('checks')||'').split('\n').map(x=>x.trim()).filter(Boolean).map(text=>({id:uid(),text,done:false}));
    S.subtasks.push({id:uid(),...data,status:'todo',moves:0,checks,doneAt:null});
    syncKeyStatus(data.keyTaskId);closeSheet();commit('Добавлено на '+dShort(data.date));
  },
  key:(fd,f)=>{
    const id=f.dataset.id;
    const data={title:fd.get('title').trim(),weight:Math.min(5,Math.max(1,+fd.get('weight')||1)),due:fd.get('due')||''};
    if(id)Object.assign(keyById(id),data);else S.keyTasks.push({id:uid(),goalId:f.dataset.g,...data,status:'todo'});
    closeSheet();commit(id?'Сохранено':'Шаг добавлен');
  },
  goal:(fd,f)=>{
    const id=f.dataset.id;
    const data={title:fd.get('title').trim(),sphereId:fd.get('sphereId'),type:fd.get('type'),target:+fd.get('target')||0,unit:fd.get('unit').trim(),weight:Math.min(5,Math.max(1,+fd.get('weight')||1))};
    if(data.type==='number'&&!data.target){toast('Укажите план, например 20');return}
    if(id){Object.assign(goalById(id),data);closeSheet();commit('Сохранено');return}
    const g={id:uid(),...data,status:'active',log:[]};S.goals.push(g);
    closeSheet();commit('Цель добавлена');openSheet(goalSheet(g.id));
  },
  event:(fd,f)=>{
    const id=f.dataset.id;
    const data={title:fd.get('title').trim(),date:fd.get('date'),time:fd.get('time')||'',goalId:fd.get('goalId')||''};
    if(id)Object.assign(S.events.find(e=>e.id===id),data);else S.events.push({id:uid(),...data});
    closeSheet();commit(id?'Сохранено':'Событие добавлено');
  },
  op:(fd,f)=>{
    const id=f.dataset.id,amount=Math.abs(parseFloat(String(fd.get('amount')).replace(',','.')));
    if(!amount){toast('Введите сумму');return}
    const data={amount,category:fd.get('category').trim()||'Другое',date:fd.get('date'),note:fd.get('note').trim()};
    if(id)Object.assign(S.finance.entries.find(e=>e.id===id),data);
    else S.finance.entries.push({id:uid(),type:f.dataset.t,ts:Date.now(),...data});
    ui.finYm=data.date.slice(0,7);
    closeSheet();commit(id?'Сохранено':(f.dataset.t==='income'?'Доход записан':'Расход записан'));
  },
  plan:fd=>{const ym=ui.finYm;const i=+fd.get('income')||0,e=+fd.get('expense')||0;if(i||e)S.finance.plans[ym]={income:i,expense:e};else delete S.finance.plans[ym];closeSheet();commit('План сохранён')},
  check:(fd,f)=>{const s=subById(f.dataset.id);s.checks=s.checks||[];s.checks.push({id:uid(),text:fd.get('text').trim(),done:false});if(s.status==='done')setSubStatus(s,'todo');commit()},
  move:(fd,f)=>{const d=fd.get('date');moveSub(subById(f.dataset.id),d);closeSheet();commit('Перенесено на '+dShort(d))},
  settings:fd=>{S.month.focus=fd.get('focus').trim();S.finance.currency=fd.get('currency').trim();closeSheet();commit('Сохранено')},
  sphere:fd=>{const n=fd.get('name').trim();if(n&&!S.spheres.some(s=>s.name===n))S.spheres.push({id:uid(),name:n,color:SPHERE_COLORS[S.spheres.length%SPHERE_COLORS.length]});commit('Сфера добавлена')},
  newmonth:fd=>{
    const [start,end]=monthBounds(fd.get('month'));
    const carry=fd.get('carry')?S.subtasks.filter(s=>live(s)&&s.status!=='done').map(s=>({...s,keyTaskId:null,date:start,status:'todo',moves:0,doneAt:null})):[];
    S.month={start,end,focus:''};S.goals=[];S.keyTasks=[];S.subtasks=carry;S.events=S.events.filter(e=>e.date>=start);
    ui.day=null;closeAll();location.hash='month';commit('Новый месяц начат');
  },
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const fn=A[el.dataset.a];if(!fn)return;
  e.preventDefault();fn(el.dataset,el,e);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();
  F[f.dataset.f]?.(new FormData(f),f);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stack.length)closeSheet()});
window.addEventListener('hashchange',()=>{readHash();render();window.scrollTo(0,0)});

readHash();render();initStore();
</script>

</body></html>
