<title>Планер целей</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one mobile-first column (max 760px), fixed bottom tab bar, "+" floating above it; sheets slide up from the bottom. Dark only, per spec. */
:root{
  --bg:#0E0E10; --card:#18181B; --raise:#232327; --line:#2E2E33;
  --fg:#F2F2F5; --mute:#9A9AA3; --acc:#5B8CFF; --on-acc:#0E0E10;
  --ok:#30D158; --warn:#FFD60A; --bad:#FF453A;
  --font:'Inter',-apple-system,'SF Pro Text','Roboto',system-ui,sans-serif;
  --r:14px; --nav-h:64px;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font:15px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:650}
h3{font-size:15px;font-weight:600}
.mute{color:var(--mute)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.top .ttl{min-width:0}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mute);display:inline-block}
.sync.db i{background:var(--ok)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.card{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid transparent}
.card.btn{text-align:left;width:100%}
.card.btn:hover{border-color:var(--line)}
.section{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)}
.bg-ok{background:var(--ok)!important} .bg-warn{background:var(--warn)!important} .bg-bad{background:var(--bad)!important}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:550;display:inline-flex;gap:6px;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dw{font-size:11px;color:var(--mute);text-align:center;padding-bottom:2px;font-weight:600}
.cell{background:var(--card);border-radius:10px;min-height:54px;padding:6px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid transparent;text-align:left}
.cell.pad{background:transparent}
.cell.today{border-color:var(--acc)}
.cell .n{font-size:13px;font-weight:650}
.cell .ev{width:6px;height:6px;border-radius:50%;background:var(--acc);display:inline-block}
.cell .ok{align-self:flex-end;width:18px;height:18px;border-radius:5px;background:var(--ok);display:grid;place-items:center}
.cell .ok::after{content:"";width:8px;height:5px;border-left:2px solid var(--on-acc);border-bottom:2px solid var(--on-acc);transform:rotate(-45deg) translate(1px,-1px)}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:12px;padding:12px}
.item.done .tt{color:var(--mute);text-decoration:line-through}
.tk{width:26px;height:26px;border-radius:8px;border:2px solid var(--mute);background:transparent;flex:none;display:grid;place-items:center;padding:0}
.tk.on{background:var(--ok);border-color:var(--ok)}
.tk.on::after{content:"";width:11px;height:6px;border-left:2.5px solid var(--on-acc);border-bottom:2.5px solid var(--on-acc);transform:rotate(-45deg) translate(1px,-1px)}
.tk.sm{width:20px;height:20px;border-radius:6px}
.tk.sm.on::after{width:8px;height:5px;border-width:0 0 2px 2px}
.tbody{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;align-self:center}
.tt{font-weight:550;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--mute);margin-top:3px;align-items:center}
.flag{color:var(--bad);font-weight:650}
.time{font-weight:650;color:var(--fg);font-size:13px;margin-right:6px}
.warnbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.empty{color:var(--mute);font-size:14px;padding:16px;border:1px dashed var(--line);border-radius:12px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.step{background:var(--card);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sub{display:flex;gap:10px;align-items:center;padding:6px 0 0 4px;border-top:1px solid var(--line)}
.sub.done .tt{color:var(--mute);text-decoration:line-through}
.chk{display:flex;gap:10px;align-items:center;background:none;border:0;padding:4px 0;text-align:left;color:var(--fg)}
.chk.on span:last-child{color:var(--mute);text-decoration:line-through}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--raise);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--acc)}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;box-shadow:0 0 0 4px var(--bg)}
.fab svg{width:26px;height:26px}
#sheet{position:fixed;inset:0;z-index:40}
#sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);border:0;width:100%;cursor:default}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92%;overflow:auto;background:var(--raise);border-radius:20px 20px 0 0;padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@media (prefers-reduced-motion:reduce){#sheet .panel{animation:none}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.x{background:var(--card);border:0;width:34px;height:34px;border-radius:10px;flex:none;font-size:20px;line-height:1;color:var(--mute)}
form.f{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;color:var(--mute);font-weight:600}
.f input,.f select,.f textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btnp{background:var(--acc);color:var(--on-acc);border:0;border-radius:12px;padding:12px 16px;font-weight:700}
.btn2{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}
.btn2.danger{color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.tabs button.on{background:var(--raise);color:var(--fg)}
.tabs.money button.on.inc{color:var(--ok)}
.tabs.money button.on.exp{color:var(--bad)}
.hint{font-size:12px;color:var(--mute)}
.evt{display:flex;gap:12px;align-items:center}
.evt .when{width:54px;flex:none;text-align:center;background:var(--raise);border-radius:10px;padding:6px 0}
.evt .when b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.evt .when span{font-size:11px;color:var(--mute)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:center}
.money3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.money3 .card{padding:12px}
.money3 b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere;line-height:1.2;margin-top:2px}
.op{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:10px 12px;width:100%;border:0;text-align:left}
.op .amt{font-weight:750;white-space:nowrap}
.daylbl{font-size:12px;color:var(--mute);font-weight:600;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (max-width:420px){.cell{min-height:50px;padding:5px}.money3 b{font-size:16px}}
</style>

<div id="app"></div>
<button class="fab" data-a="add" aria-label="Добавить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="nav"><div class="in" id="nav"></div></nav>
<div id="sheet" hidden><button class="scrim" data-a="close" aria-label="Закрыть"></button><div class="panel" role="dialog" aria-modal="true" id="panel"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ===================== helpers ===================== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const dow=s=>(pd(s).getDay()+6)%7;
const TODAY=iso(new Date());
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const DW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DWF=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dShort=s=>pd(s).getDate()+' '+MS[pd(s).getMonth()];
const dLong=s=>pd(s).getDate()+' '+MG[pd(s).getMonth()];
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c};
const monthBounds=ym=>{const[y,m]=ym.split('-').map(Number);return [`${y}-${pad(m)}-01`,iso(new Date(y,m,0))]};
const ymTitle=ym=>{const[y,m]=ym.split('-').map(Number);return MN[m-1]+' '+y};
const ymShift=(ym,n)=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const dayList=(a,b)=>{const r=[];for(let d=a;d<=b;d=addDays(d,1))r.push(d);return r};
const SPHERE_COLORS=['#64A8FF','#BF7AF0','#FF9F5A','#4FD1C5','#E58FB5','#A3B1FF','#D4C17A'];
const EXP_CATS=['Обязательные','Депозит','Благое','Гулянки','Агентство','Еда','Транспорт','Жильё','Связь и подписки','Здоровье','Одежда','Остальное'];
const OTHER='Остальное';
const INC_CATS=['Клиенты','Зарплата','Подработка','Возврат долга','Остальное'];

/* ===================== state & storage ===================== */
function emptyState(){
  const [start,end]=monthBounds(TODAY.slice(0,7));
  return {v:3,month:{start,end,focus:''},
    spheres:['Работа','Клиенты','Финансы','Здоровье','Личное'].map((name,i)=>({id:uid(),name,color:SPHERE_COLORS[i]})),
    goals:[],keyTasks:[],subtasks:[],events:[],finance:{currency:'₸',entries:[],plans:{}}};
}
/** Пример из первой версии заменяется пустым планом; старые сохранения приводятся к простым галочкам. */
function normalize(x){
  if(!x||!x.month||x.demo)return emptyState();
  x.v=3;
  x.finance=x.finance||{currency:'₸',entries:[],plans:{}};
  x.finance.plans=x.finance.plans||{};
  for(const k of ['spheres','goals','keyTasks','subtasks','events'])x[k]=x[k]||[];
  x.goals=x.goals.filter(g=>g.status!=='cancelled');x.goals.forEach(g=>{g.done=g.done??(g.status==='done')});
  x.keyTasks=x.keyTasks.filter(k=>k.status!=='cancelled');x.keyTasks.forEach(k=>{k.done=k.done??(k.status==='done')});
  x.subtasks=x.subtasks.filter(s=>s.status!=='cancelled'&&s.date);x.subtasks.forEach(s=>{s.done=s.done??(s.status==='done')});
  delete x.archive;delete x.settings;
  return x;
}
const LS_KEY='goal-planner-v1';
let S=null;
try{const raw=localStorage.getItem(LS_KEY);if(raw)S=JSON.parse(raw)}catch(e){}
S=normalize(S);
let store={kind:'local',ref:null,busy:false,again:false};
let saveTimer=null;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,500)}
async function flush(){
  const json=JSON.stringify(S);
  try{localStorage.setItem(LS_KEY,json)}catch(e){}
  if(store.kind!=='db')return;
  if(store.busy){store.again=true;return}
  store.busy=true;
  try{await store.ref.set({json,updatedAt:Date.now()});setSync('db')}catch(e){setSync('err')}
  store.busy=false;
  if(store.again){store.again=false;flush()}
}
let syncState='local';
function setSync(k){syncState=k;const el=$('#sync');if(el)el.outerHTML=syncHTML()}
function syncHTML(){
  const t={local:'Сохраняется на этом устройстве',db:'Сохранено в вашем аккаунте',err:'Не удалось сохранить в аккаунт',load:'Подключаю аккаунт…'}[syncState];
  return `<span id="sync" class="sync ${syncState==='db'?'db':''}"><i></i>${t}</span>`;
}
async function initStore(){
  let C=window.claude;
  for(let i=0;i<10&&!C?.use;i++){await new Promise(r=>setTimeout(r,150));C=window.claude}
  if(!C?.use)return;
  setSync('load');
  try{
    const [db,user]=await Promise.all([C.use('db'),C.use('user')]);
    if(!db||!user){setSync('local');return}
    const id=await user.id();
    if(!id){setSync('local');return}
    const ref=db.doc('data/users/'+id+'/planner');
    const snap=await Promise.race([ref.get(),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),10000))]);
    store={kind:'db',ref,busy:false,again:false};
    if(snap.exists){
      const d=snap.data();let changed=false;
      if(d&&typeof d.json==='string'){try{const x=JSON.parse(d.json);changed=x.v!==3;S=normalize(x)}catch(e){}}
      setSync('db');render();renderSheet();
      if(changed)flush();
    }else{setSync('db');flush()}
  }catch(e){setSync('local')}
}

/* ===================== lookups ===================== */
const goalById=id=>S.goals.find(g=>g.id===id);
const keyById=id=>S.keyTasks.find(k=>k.id===id);
const subById=id=>S.subtasks.find(s=>s.id===id);
const sphereById=id=>S.spheres.find(s=>s.id===id)||{name:'Без сферы',color:'#9A9AA3'};
const goalOfSub=s=>{const k=s.keyTaskId&&keyById(s.keyTaskId);return k?goalById(k.goalId):null};
const inMonth=d=>d>=S.month.start&&d<=S.month.end;
const monthTitle=()=>ymTitle(S.month.start.slice(0,7));
const tasksOn=d=>S.subtasks.filter(s=>s.date===d);
const dayDone=d=>{const t=tasksOn(d);return t.length>0&&t.every(s=>s.done)};

/* finance */
const money=n=>{const r=Math.round((+n||0)*100)/100;return r.toLocaleString('ru-RU',{maximumFractionDigits:2})+' '+(S.finance.currency||'')};
const entriesOf=ym=>S.finance.entries.filter(e=>e.date.slice(0,7)===ym);
function finStat(ym){
  const es=entriesOf(ym);
  const inc=es.filter(e=>e.type==='income').reduce((a,e)=>a+e.amount,0);
  const exp=es.filter(e=>e.type==='expense').reduce((a,e)=>a+e.amount,0);
  return {inc,exp,bal:inc-exp,es};
}
function byCat(es,type){const m={};es.filter(e=>e.type===type).forEach(e=>{m[e.category]=(m[e.category]||0)+e.amount});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function catList(type){
  const base=type==='income'?INC_CATS:EXP_CATS;
  const used=[...new Set(S.finance.entries.filter(e=>e.type===type).map(e=>e.category))];
  return [...used,...base.filter(c=>!used.includes(c))];
}

/* ===================== UI state ===================== */
const ROUTES=['month','day','goals','money'];
const ui={route:'month',day:null,addTab:'task',finYm:TODAY.slice(0,7),moneyType:'expense'};
function curDay(){return ui.day||(inMonth(TODAY)?TODAY:S.month.start)}
function readHash(){const h=location.hash.slice(1);ui.route=ROUTES.includes(h)?h:'month'}
function commit(msg){save();render();renderSheet();if(msg)toast(msg)}
function moveSub(s,date){if(s.date&&date!==s.date&&!s.done)s.moves=(s.moves||0)+1;s.date=date}

/* ===================== components ===================== */
const I={
  month:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  day:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  goals:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8" fill="currentColor"/></svg>',
  money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',
};
const bar=(p,cls,color)=>`<div class="bar"><i class="${cls?'bg-'+cls:''}" style="width:${Math.max(0,Math.min(100,p||0))}%;${color?'background:'+color:''}"></i></div>`;
const box=(on,act,id,label,sm)=>`<button class="tk ${sm?'sm':''} ${on?'on':''}" data-a="${act}" data-id="${id}" aria-label="${on?'Снять отметку':'Отметить'}: ${esc(label)}" aria-pressed="${on}"></button>`;
function topbar(title,sub){
  return `<div class="top"><div class="ttl"><h1>${title}</h1>${sub?`<div class="small mute">${sub}</div>`:''}</div>
  <button class="iconbtn" data-a="settings" aria-label="Настройки">${I.gear}</button></div>`;
}
function taskRow(s){
  const g=goalOfSub(s);

  return `<div class="item ${s.done?'done':''}">
    ${box(s.done,'tog',s.id,s.title)}
    <button class="tbody" data-a="task" data-id="${s.id}">
      <div class="tt">${s.time?`<span class="time">${s.time}</span>`:''}${esc(s.title)}</div>
      ${g||stuck||(s.checks||[]).length?`<div class="meta">${g?`<span class="row" style="gap:5px"><span class="dot" style="background:${sphereById(g.sphereId).color}"></span>${esc(g.title)}</span>`:''}${(s.checks||[]).length?`<span>${s.checks.length} ${plural(s.checks.length,'пункт','пункта','пунктов')}</span>`:''}${stuck?'<span class="flag">Застряла</span>':''}</div>`:''}
    </button>
  </div>`;
}
function goalRow(g){
  const sp=sphereById(g.sphereId);
  return `<div class="item ${g.done?'done':''}">
    ${box(g.done,'goaltog',g.id,g.title)}
    <button class="tbody" data-a="goal" data-id="${g.id}"><div class="tt">${esc(g.title)}</div><div class="meta"><span class="row" style="gap:5px"><span class="dot" style="background:${sp.color}"></span>${esc(sp.name)}</span></div></button>
  </div>`;
}
function eventRow(e){
  const g=e.goalId&&goalById(e.goalId),left=diff(TODAY,e.date);
  const cnt=left===0?'сегодня':left===1?'завтра':left>0?`через ${left} ${plural(left,'день','дня','дней')}`:`${-left} ${plural(-left,'день','дня','дней')} назад`;
  return `<button class="card btn evt" data-a="event" data-id="${e.id}">
    <div class="when"><b>${pd(e.date).getDate()}</b><span>${MS[pd(e.date).getMonth()]}</span></div>
    <div class="grow"><div class="tt">${esc(e.title)}</div><div class="meta"><span class="${left>=0&&left<=1?'c-warn':''}" style="font-weight:600">${cnt}</span>${e.time?`<span>${e.time}</span>`:''}${g?`<span>${esc(g.title)}</span>`:''}</div></div>
  </button>`;
}

/* ===================== screens ===================== */
function screenMonth(){
  let cal=DW.map(d=>`<div class="dw">${d}</div>`).join('');
  for(let i=0;i<dow(S.month.start);i++)cal+='<div class="cell pad"></div>';
  for(const d of dayList(S.month.start,S.month.end)){
    const ev=S.events.some(e=>e.date===d),ok=dayDone(d);
    cal+=`<button class="cell ${d===TODAY?'today':''}" data-a="goday" data-d="${d}" aria-label="${dLong(d)}${ok?', всё выполнено':''}">
      <div class="row between"><span class="n">${pd(d).getDate()}</span>${ev?'<span class="ev"></span>':''}</div>${ok?'<span class="ok"></span>':''}</button>`;
  }
  const upcoming=S.events.filter(e=>e.date>=TODAY).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const fin=finStat(S.month.start.slice(0,7));
  return topbar(monthTitle(),S.month.focus?'Фокус: '+esc(S.month.focus):'')+
  (TODAY>S.month.end?`<div class="warnbox row between" style="margin-bottom:12px;border-color:var(--acc)"><span>${monthTitle()} закончился.</span><button class="btnp" data-a="newmonth">Начать ${MN[pd(TODAY).getMonth()].toLowerCase()}</button></div>`:'')+
  `<div class="section" style="margin-top:4px"><div class="row between"><h2>Цели месяца</h2>${S.goals.length?'<button class="chip" data-a="add" data-tab="goal">+ Цель</button>':''}</div>
     ${S.goals.length?S.goals.map(goalRow).join(''):`<div class="empty"><span>Целей пока нет. Поставьте 3–5 целей на месяц.</span><button class="btnp" data-a="add" data-tab="goal">Добавить первую цель</button></div>`}
   </div>
   <div class="section"><div class="row between"><h2>Календарь</h2><span class="small mute">галочка — все задачи дня сделаны</span></div><div class="cal">${cal}</div></div>
   <div class="section"><div class="row between"><h2>Ключевые события</h2><button class="chip" data-a="add" data-tab="event">+ Событие</button></div>
     ${upcoming.length?upcoming.map(eventRow).join(''):'<div class="empty">Запуски, встречи, дедлайны и оплаты появятся здесь.</div>'}
   </div>
   <div class="section"><div class="row between"><h2>Финансы месяца</h2><button class="chip" data-a="nav" data-r="money">Открыть</button></div>
     <div class="money3"><div class="card"><span class="small mute">Доход</span><b class="c-ok">${money(fin.inc)}</b></div><div class="card"><span class="small mute">Расход</span><b class="c-bad">${money(fin.exp)}</b></div><div class="card"><span class="small mute">Остаток</span><b>${money(fin.bal)}</b></div></div>
   </div>`;
}
function screenDay(){
  const d=curDay();
  const ts=tasksOn(d).sort((x,y)=>(x.time||'99').localeCompare(y.time||'99'));
  const evs=S.events.filter(e=>e.date===d);
  const label=d===TODAY?'Сегодня':d===addDays(TODAY,1)?'Завтра':d===addDays(TODAY,-1)?'Вчера':DWF[dow(d)];
  const left=ts.filter(s=>!s.done).length;
  return topbar(label,`${DWF[dow(d)]}, ${dLong(d)}`)+
  `<div class="row between"><button class="iconbtn" data-a="dy" data-n="-1" aria-label="Предыдущий день">${I.left}</button><button class="chip" data-a="add" data-tab="task" data-d="${d}">+ Задача</button><button class="iconbtn" data-a="dy" data-n="1" aria-label="Следующий день">${I.right}</button></div>
   ${evs.length?`<div class="section"><h2>События дня</h2>${evs.map(eventRow).join('')}</div>`:''}
   <div class="section"><h2>Задачи</h2>${ts.length?ts.map(taskRow).join(''):'<div class="empty">На этот день задач нет.</div>'}</div>
   ${left&&d<=TODAY?`<div class="section"><button class="btn2" data-a="carry" data-d="${d}">Перенести невыполненное на завтра</button></div>`:''}`;
}
function screenGoals(){
  return topbar('Цели',monthTitle())+
  `<button class="btnp" data-a="add" data-tab="goal" style="width:100%">Добавить цель</button>
   <div class="section">${S.goals.length?S.goals.map(goalRow).join(''):'<div class="empty">Здесь будут ваши цели месяца.</div>'}</div>
   ${S.goals.length?'<div class="hint" style="margin-top:12px">Нажмите на цель, чтобы разбить её на шаги и задачи.</div>':''}`;
}
function screenMoney(){
  const ym=ui.finYm,{inc,exp,bal,es}=finStat(ym);
  const plan=S.finance.plans[ym]||{};
  const [a,b]=monthBounds(ym);
  const daysPassed=TODAY<a?0:TODAY>b?diff(a,b)+1:diff(a,TODAY)+1;
  const expCats=byCat(es,'expense'),incCats=byCat(es,'income');
  const sorted=[...es].sort((x,y)=>y.date.localeCompare(x.date)||(y.ts||0)-(x.ts||0));
  let lastDate='',ops='';
  for(const e of sorted){
    if(e.date!==lastDate){ops+=`<div class="daylbl">${e.date===TODAY?'Сегодня':DWF[dow(e.date)]+', '+dLong(e.date)}</div>`;lastDate=e.date}
    ops+=`<button class="op" data-a="editop" data-id="${e.id}"><div class="grow"><div class="tt">${esc(e.category)}</div>${e.note?`<div class="small mute" style="overflow-wrap:anywhere">${esc(e.note)}</div>`:''}</div><span class="amt ${e.type==='income'?'c-ok':''}">${e.type==='income'?'+':'−'}${money(e.amount)}</span></button>`;
  }
  const notesOf=(c,type)=>es.filter(e=>e.type===type&&e.category===c&&e.note).map(e=>`${esc(e.note)} — ${money(e.amount)}`);
  const catBars=(list,total,color,type)=>`<div class="card hbar">${list.map(([c,v])=>{const ns=c===OTHER?notesOf(c,type):[];return `<div><div class="small" style="margin-bottom:5px">${esc(c)}</div>${bar(v/total*100,'',color)}${ns.length?`<div class="small mute" style="margin-top:6px;display:flex;flex-direction:column;gap:2px">${ns.map(n=>`<span>· ${n}</span>`).join('')}</div>`:''}</div><b style="text-align:right;align-self:start">${money(v)}</b>`}).join('')}</div>`;
  return topbar('Финансы','Доходы и расходы за месяц')+
  `<div class="row between" style="margin-bottom:12px"><button class="iconbtn" data-a="fym" data-n="-1" aria-label="Предыдущий месяц">${I.left}</button><h2>${ymTitle(ym)}</h2><button class="iconbtn" data-a="fym" data-n="1" aria-label="Следующий месяц">${I.right}</button></div>
   <div class="money3"><div class="card"><span class="small mute">Заработал</span><b class="c-ok">${money(inc)}</b></div><div class="card"><span class="small mute">Потратил</span><b class="c-bad">${money(exp)}</b></div><div class="card"><span class="small mute">Осталось</span><b class="${bal<0?'c-bad':''}">${money(bal)}</b></div></div>
   <div class="btnrow" style="margin-top:12px"><button class="btn2 grow" data-a="addop" data-t="income">+ Доход</button><button class="btn2 grow" data-a="addop" data-t="expense">+ Расход</button></div>
   <div class="section"><div class="row between"><h2>План на месяц</h2><button class="chip" data-a="plan">${plan.income||plan.expense?'Изменить':'Задать'}</button></div>
     ${plan.income||plan.expense?`<div class="card stack">
       ${plan.income?`<div><div class="small" style="margin-bottom:6px">Доход: ${money(inc)} из ${money(plan.income)}</div>${bar(inc/plan.income*100,'ok')}${inc<plan.income?`<div class="small mute" style="margin-top:6px">До цели ещё ${money(plan.income-inc)}</div>`:''}</div>`:''}
       ${plan.expense?(()=>{const c=exp>plan.expense?'bad':exp>plan.expense*.85?'warn':'ok';return `<div><div class="small" style="margin-bottom:6px">Расходы: ${money(exp)} из ${money(plan.expense)}</div>${bar(exp/plan.expense*100,c)}<div class="small ${exp>plan.expense?'c-bad':'mute'}" style="margin-top:6px">${exp>plan.expense?`Лимит превышен на ${money(exp-plan.expense)}`:`Можно потратить ещё ${money(plan.expense-exp)}`}</div></div>`})():''}
     </div>`:'<div class="empty">Задайте, сколько хотите заработать и сколько готовы потратить.</div>'}
   </div>
   <div class="section"><h2>Куда ушли деньги</h2>${expCats.length?catBars(expCats,exp,'var(--bad)','expense')+`<div class="small mute">В среднем ${money(daysPassed?exp/daysPassed:0)} в день</div>`:'<div class="empty">Расходов за месяц пока нет.</div>'}</div>
   <div class="section"><h2>Откуда пришли</h2>${incCats.length?catBars(incCats,inc,'var(--ok)','income'):'<div class="empty">Доходов за месяц пока нет.</div>'}</div>
   <div class="section"><h2>Все операции</h2>${ops||'<div class="empty">Операций пока нет. Нажмите «+», чтобы записать доход или расход.</div>'}</div>`;
}

/* ===================== sheets ===================== */
let stack=[];
function openSheet(fn){stack.push(fn);renderSheet();const p=$('#panel');p.scrollTop=0;setTimeout(()=>{const f=p.querySelector('[autofocus]');if(f)f.focus()},60)}
function closeSheet(){stack.pop();renderSheet()}
function closeAll(){stack=[];renderSheet()}
function renderSheet(){
  const sh=$('#sheet');
  if(!stack.length){sh.hidden=true;return}
  const html=stack[stack.length-1]();
  if(html==null){stack.pop();return renderSheet()}
  const p=$('#panel'),y=p.scrollTop;
  p.innerHTML='<div class="grab"></div>'+html;sh.hidden=false;p.scrollTop=y;
}
const head=(t,sub)=>`<div class="sheethead"><div class="grow"><h2>${t}</h2>${sub?`<div class="small mute" style="margin-top:3px">${sub}</div>`:''}</div><button class="x" data-a="close" aria-label="Закрыть">×</button></div>`;
function linkOptions(sel){
  let o=`<option value="" ${!sel?'selected':''}>Без цели</option>`;
  for(const g of S.goals){const ks=S.keyTasks.filter(k=>k.goalId===g.id);if(!ks.length)continue;o+=`<optgroup label="${esc(g.title)}">${ks.map(k=>`<option value="${k.id}" ${sel===k.id?'selected':''}>${esc(k.title)}</option>`).join('')}</optgroup>`}
  return o;
}
const goalOptions=(sel,none)=>(none?`<option value="">${none}</option>`:'')+S.goals.map(g=>`<option value="${g.id}" ${sel===g.id?'selected':''}>${esc(g.title)}</option>`).join('');
const sphereOptions=sel=>S.spheres.map(s=>`<option value="${s.id}" ${sel===s.id?'selected':''}>${esc(s.name)}</option>`).join('');

function taskForm(s,pre={}){
  const isNew=!s;s=s||{title:'',date:pre.date||curDay(),time:'',keyTaskId:pre.keyTaskId||null};
  return `<form class="f" data-f="task" data-id="${isNew?'':s.id}">
    <label class="fld"><span>Что сделать</span><input id="tf-title" name="title" value="${esc(s.title)}" required autofocus autocomplete="off"></label>
    ${S.keyTasks.length?`<label class="fld"><span>К какому шагу цели относится</span><select id="tf-link" name="link">${linkOptions(s.keyTaskId)}</select></label>`:''}
    <div class="two"><label class="fld"><span>Дата</span><input id="tf-date" type="date" name="date" value="${s.date||''}" required></label><label class="fld"><span>Время</span><input id="tf-time" type="time" name="time" value="${s.time||''}"></label></div>
    ${isNew?'<label class="fld"><span>Чек-пункты, каждый с новой строки (необязательно)</span><textarea id="tf-checks" name="checks"></textarea></label>':''}
    <button class="btnp" type="submit">${isNew?'Добавить задачу':'Сохранить'}</button>
  </form>`;
}
function keyForm(k,pre={}){
  const isNew=!k;k=k||{goalId:pre.goalId,title:'',due:''};
  return `<form class="f" data-f="key" data-id="${isNew?'':k.id}" data-g="${k.goalId}">
    <label class="fld"><span>Шаг к цели</span><input id="kf-title" name="title" value="${esc(k.title)}" placeholder="Крупный шаг на 1–2 недели" required autofocus autocomplete="off"></label>
    <label class="fld"><span>Срок (необязательно)</span><input id="kf-due" type="date" name="due" value="${k.due||''}"></label>
    <button class="btnp" type="submit">${isNew?'Добавить шаг':'Сохранить'}</button>
  </form>`;
}
function goalForm(g){
  const isNew=!g;g=g||{sphereId:S.spheres[0]?.id,title:''};
  return `<form class="f" data-f="goal" data-id="${isNew?'':g.id}">
    <label class="fld"><span>Цель на месяц</span><input id="gf-title" name="title" value="${esc(g.title)}" required autofocus autocomplete="off"></label>
    ${S.spheres.length?`<label class="fld"><span>Сфера</span><select id="gf-sphere" name="sphereId">${sphereOptions(g.sphereId)}</select></label>`:''}
    <button class="btnp" type="submit">${isNew?'Добавить цель':'Сохранить'}</button>
  </form>`;
}
function eventForm(e,pre={}){
  const isNew=!e;e=e||{title:'',date:pre.date||curDay(),time:'',goalId:''};
  return `<form class="f" data-f="event" data-id="${isNew?'':e.id}">
    <label class="fld"><span>Событие</span><input id="ef-title" name="title" value="${esc(e.title)}" placeholder="Запуск, встреча, дедлайн, оплата" required autofocus autocomplete="off"></label>
    <div class="two"><label class="fld"><span>Дата</span><input id="ef-date" type="date" name="date" value="${e.date}" required></label><label class="fld"><span>Время</span><input id="ef-time" type="time" name="time" value="${e.time||''}"></label></div>
    ${S.goals.length?`<label class="fld"><span>Связанная цель</span><select id="ef-goal" name="goalId">${goalOptions(e.goalId,'Без цели')}</select></label>`:''}
    <button class="btnp" type="submit">${isNew?'Добавить событие':'Сохранить'}</button>
  </form>`;
}
function opForm(op){
  const isNew=!op;const t=op?op.type:ui.moneyType;
  op=op||{type:t,amount:'',category:'',date:TODAY,note:''};
  const cats=catList(t);

  <form class="f" data-f="op" data-id="${isNew?'':op.id}" data-t="${t}">
    <label class="fld"><span>Сумма, ${esc(S.finance.currency)}</span><input id="of-amount" type="number" inputmode="decimal" min="0" step="any" name="amount" value="${op.amount}" required autofocus></label>
    <label class="fld"><span>${t==='income'?'Откуда':'На что'}</span><input id="of-cat" name="category" list="of-cats" value="${esc(op.category)}" placeholder="Выберите или впишите свою" required autocomplete="off"><datalist id="of-cats">${cats.map(c=>`<option value="${esc(c)}"></option>`).join('')}</datalist></label>
    <div class="chips">${cats.slice(0,14).map(c=>`<button type="button" class="chip" data-a="pickcat" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="two"><label class="fld"><span>Дата</span><input id="of-date" type="date" name="date" value="${op.date}" required></label><label class="fld"><span>Комментарий${op.category===OTHER?' (обязательно)':''}</span><input id="of-note" name="note" value="${esc(op.note||'')}" placeholder="${op.category===OTHER?'На что именно':''}" autocomplete="off"></label></div>
    <button class="btnp" type="submit">${isNew?(t==='income'?'Записать доход':'Записать расход'):'Сохранить'}</button>

function addSheet(){
  const t=ui.addTab,pre=ui.addPre||{};
  const tabs={task:'Задача',goal:'Цель',event:'Событие',money:'Деньги'};
  return head('Добавить')+`<div class="tabs">${Object.entries(tabs).map(([k,v])=>`<button class="${t===k?'on':''}" data-a="tab" data-t="${k}">${v}</button>`).join('')}</div>`+
    (t==='task'?taskForm(null,pre):t==='goal'?goalForm(null):t==='event'?eventForm(null,pre):opForm(null));
}
function taskSheet(id){return()=>{
  const s=subById(id);if(!s)return null;
  const g=goalOfSub(s),k=s.keyTaskId&&keyById(s.keyTaskId);
  return head(esc(s.title),[s.date?DWF[dow(s.date)]+', '+dLong(s.date)+(s.time?' · '+s.time:''):'',g?esc(g.title)+' → '+esc(k.title):''].filter(Boolean).join('<br>'))+
  `<div class="stack">
    ${(s.moves||0)>=3&&!s.done?`<div class="warnbox" style="border-color:var(--bad)"><b class="c-bad">Застряла.</b> Задачу переносили ${s.moves} раза. Разбейте её на шаги поменьше или удалите.</div>`:''}
    <button class="${s.done?'btn2':'btnp'}" data-a="tog" data-id="${s.id}">${s.done?'Снять галочку':'Отметить выполненной'}</button>
    <div><div class="small mute" style="margin-bottom:4px;font-weight:600">Чек-пункты</div>
      ${(s.checks||[]).map(c=>`<button class="chk ${c.done?'on':''}" data-a="check" data-id="${s.id}" data-c="${c.id}"><span class="tk sm ${c.done?'on':''}"></span><span>${esc(c.text)}</span></button>`).join('')}
      <form class="f" data-f="check" data-id="${s.id}" style="flex-direction:row;margin-top:8px"><input id="ck-new" name="text" placeholder="Новый пункт" autocomplete="off" required><button class="btn2" type="submit">Добавить</button></form>

    <div class="btnrow"><button class="btn2" data-a="move" data-id="${s.id}">Перенести</button><button class="btn2" data-a="edittask" data-id="${s.id}">Изменить</button><button class="btn2 danger" data-a="delsub" data-id="${s.id}">Удалить</button></div>
  </div>`}}
function moveSheet(id){return()=>{
  const s=subById(id);if(!s)return null;
  const base=s.date>=TODAY?s.date:TODAY;
  return head('Перенести',esc(s.title))+`<div class="stack">
    <div class="btnrow"><button class="btn2" data-a="moveto" data-id="${id}" data-d="${addDays(TODAY,1)}">Завтра · ${dShort(addDays(TODAY,1))}</button><button class="btn2" data-a="moveto" data-id="${id}" data-d="${addDays(base,7)}">Через неделю · ${dShort(addDays(base,7))}</button></div>
    <form class="f" data-f="move" data-id="${id}" style="flex-direction:row"><input id="mv-date" type="date" name="date" value="${s.date}" required><button class="btnp" type="submit">Перенести</button></form>
    <div class="hint">После третьего переноса задача помечается «Застряла».</div></div>`}}
function goalSheet(id){return()=>{
  const g=goalById(id);if(!g)return null;
  const keys=S.keyTasks.filter(k=>k.goalId===g.id);
  return head(esc(g.title),esc(sphereById(g.sphereId).name))+
  `<div class="stack">
    <button class="${g.done?'btn2':'btnp'}" data-a="goaltog" data-id="${g.id}">${g.done?'Снять галочку с цели':'Цель достигнута'}</button>
    <div class="row between"><h3>Шаги к цели</h3><button class="chip" data-a="addkey" data-g="${g.id}">+ Шаг</button></div>
    ${keys.length?keys.map(k=>{
      const ss=S.subtasks.filter(s=>s.keyTaskId===k.id).sort((a,b)=>a.date.localeCompare(b.date));
      return `<div class="step">
        <div class="row" style="align-items:flex-start">${box(k.done,'keytog',k.id,k.title)}<button class="tbody" data-a="editkey" data-id="${k.id}"><div class="tt" style="${k.done?'color:var(--mute);text-decoration:line-through':''}">${esc(k.title)}</div>${k.due?`<div class="meta"><span>до ${dShort(k.due)}</span></div>`:''}</button></div>
        ${ss.map(s=>`<div class="sub ${s.done?'done':''}">${box(s.done,'tog',s.id,s.title,true)}<button class="tbody" data-a="task" data-id="${s.id}"><span class="tt small">${esc(s.title)}</span> <span class="small mute">${dShort(s.date)}</span></button></div>`).join('')}
        <div><button class="chip" data-a="add" data-tab="task" data-k="${k.id}">+ Задача</button></div>
      </div>`}).join(''):'<div class="empty">Разбейте цель на несколько шагов, а шаги — на задачи по дням.</div>'}
    <div class="btnrow"><button class="btn2" data-a="editgoal" data-id="${g.id}">Изменить цель</button><button class="btn2 danger" data-a="delgoal" data-id="${g.id}">Удалить цель</button></div>
  </div>`}}
function eventSheet(id){return()=>{
  const e=S.events.find(x=>x.id===id);if(!e)return null;
  return head('Событие',`${DWF[dow(e.date)]}, ${dLong(e.date)}`)+eventForm(e)+`<button class="btn2 danger" data-a="delevent" data-id="${e.id}" style="margin-top:10px;width:100%">Удалить событие</button>`}}
function planSheet(){
  const ym=ui.finYm,p=S.finance.plans[ym]||{};
  return head('План на '+ymTitle(ym).toLowerCase())+`<form class="f" data-f="plan">
    <label class="fld"><span>Хочу заработать, ${esc(S.finance.currency)}</span><input id="pl-inc" type="number" min="0" step="any" name="income" value="${p.income||''}"></label>
    <label class="fld"><span>Лимит расходов, ${esc(S.finance.currency)}</span><input id="pl-exp" type="number" min="0" step="any" name="expense" value="${p.expense||''}"></label>
    <button class="btnp" type="submit">Сохранить</button></form>`;
}
function settingsSheet(){
  return head('Настройки')+`<form class="f" data-f="settings">
    <label class="fld"><span>Фокус месяца</span><input id="st-focus" name="focus" value="${esc(S.month.focus||'')}" placeholder="Главное в этом месяце" autocomplete="off"></label>
    <label class="fld"><span>Валюта</span><input id="st-cur" name="currency" value="${esc(S.finance.currency)}" placeholder="₸, ₽, $" autocomplete="off"></label>
    <button class="btnp" type="submit">Сохранить</button></form>
    <div class="section"><h3>Сферы целей</h3><div class="chips">${S.spheres.map(s=>`<span class="chip"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}${S.goals.some(g=>g.sphereId===s.id)?'':`<button class="x" style="width:22px;height:22px;font-size:15px;background:none" data-a="delsphere" data-id="${s.id}" aria-label="Удалить сферу ${esc(s.name)}">×</button>`}</span>`).join('')}</div>
      <form class="f" data-f="sphere" style="flex-direction:row"><input id="st-sphere" name="name" placeholder="Новая сфера" required autocomplete="off"><button class="btn2" type="submit">Добавить</button></form></div>
    <div class="section"><h3>Месяц</h3><div class="btnrow"><button class="btn2" data-a="newmonth">Начать новый месяц</button><button class="btn2 danger" data-a="wipe">Очистить всё</button></div>
      <div class="small mute">${syncState==='db'?'Данные хранятся в вашем аккаунте и видны только вам.':'Данные хранятся в этом браузере.'}</div></div>`;
}
function newMonthSheet(){
  const cur=S.month.start.slice(0,7),now=TODAY.slice(0,7);
  const def=now>cur?now:ymShift(cur,1);
  return head('Новый месяц','Цели и шаги текущего месяца закроются. Финансы сохранятся.')+`<form class="f" data-f="newmonth">
    <label class="fld"><span>Месяц</span><input id="nm-month" type="month" name="month" value="${def}" required></label>
    <label class="row small"><input type="checkbox" id="nm-carry" name="carry" checked style="width:auto"> Перенести невыполненные задачи на первый день</label>
    <button class="btnp" type="submit">Начать месяц</button></form>`;
}

/* ===================== render ===================== */
function render(){
  const r=ui.route;
  const html={month:screenMonth,day:screenDay,goals:screenGoals,money:screenMoney}[r]();
  $('#app').innerHTML=`<div class="wrap">${html}<div style="margin-top:28px;display:flex;justify-content:center">${syncHTML()}</div></div>`;
  $('#nav').innerHTML=[['month','Месяц'],['day','День'],['goals','Цели'],['money','Финансы']].map(([k,v])=>`<button class="${r===k?'on':''}" data-a="nav" data-r="${k}" aria-current="${r===k?'page':'false'}">${I[k]}<span>${v}</span></button>`).join('');
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800)}
function arm(el,text){if(el.dataset.armed)return true;el.dataset.armed='1';el.textContent=text||'Нажмите ещё раз, чтобы удалить';return false}

/* ===================== actions ===================== */
const A={
  nav:d=>{location.hash=d.r},
  goday:d=>{ui.day=d.d;location.hash='day';if(ui.route==='day')render()},
  dy:d=>{ui.day=addDays(curDay(),+d.n);render()},
  fym:d=>{ui.finYm=ymShift(ui.finYm,+d.n);render()},
  tog:d=>{const s=subById(d.id);s.done=!s.done;commit()},
  goaltog:d=>{const g=goalById(d.id);g.done=!g.done;commit(g.done?'Цель достигнута':null)},
  keytog:d=>{const k=keyById(d.id);k.done=!k.done;commit()},
  check:d=>{const s=subById(d.id),c=s.checks.find(x=>x.id===d.c);c.done=!c.done;commit()},
  task:d=>openSheet(taskSheet(d.id)),
  goal:d=>openSheet(goalSheet(d.id)),
  event:d=>openSheet(eventSheet(d.id)),
  add:d=>{
    if(!d.tab&&ui.route==='money'){ui.moneyType='expense';openSheet(()=>head('Новая операция')+opForm(null));return}
    ui.addTab=d.tab||'task';ui.addPre={date:d.d||(ui.route==='day'?curDay():undefined),keyTaskId:d.k};openSheet(addSheet)},
  tab:d=>{ui.addTab=d.t;renderSheet()},
  close:()=>closeSheet(),
  addkey:d=>openSheet(()=>head('Новый шаг',esc(goalById(d.g)?.title))+keyForm(null,{goalId:d.g})),
  move:d=>openSheet(moveSheet(d.id)),
  moveto:d=>{moveSub(subById(d.id),d.d);closeSheet();commit('Перенесено на '+dShort(d.d))},
  edittask:d=>openSheet(()=>{const s=subById(d.id);return s?head('Изменить задачу')+taskForm(s):null}),
  delsub:(d,el)=>{if(!arm(el))return;S.subtasks=S.subtasks.filter(x=>x.id!==d.id);closeSheet();commit('Удалено')},
  editkey:d=>openSheet(()=>{const k=keyById(d.id);return k?head('Изменить шаг')+keyForm(k)+`<button class="btn2 danger" data-a="delkey" data-id="${k.id}" style="margin-top:10px;width:100%">Удалить шаг</button>`:null}),
  delkey:(d,el)=>{if(!arm(el,'Задачи шага станут без цели. Нажмите ещё раз'))return;S.subtasks.forEach(s=>{if(s.keyTaskId===d.id)s.keyTaskId=null});S.keyTasks=S.keyTasks.filter(k=>k.id!==d.id);closeSheet();commit('Шаг удалён')},
  editgoal:d=>openSheet(()=>{const g=goalById(d.id);return g?head('Изменить цель')+goalForm(g):null}),
  delgoal:(d,el)=>{if(!arm(el,'Удалить вместе с шагами и задачами? Нажмите ещё раз'))return;const ks=S.keyTasks.filter(k=>k.goalId===d.id).map(k=>k.id);S.subtasks=S.subtasks.filter(s=>!ks.includes(s.keyTaskId));S.keyTasks=S.keyTasks.filter(k=>k.goalId!==d.id);S.goals=S.goals.filter(g=>g.id!==d.id);S.events.forEach(e=>{if(e.goalId===d.id)e.goalId=''});closeAll();commit('Цель удалена')},
  delevent:(d,el)=>{if(!arm(el))return;S.events=S.events.filter(e=>e.id!==d.id);closeAll();commit('Событие удалено')},
  carry:d=>{const t=addDays(d.d,1);let c=0;S.subtasks.forEach(s=>{if(s.date===d.d&&!s.done){moveSub(s,t);c++}});commit(`Перенесено на завтра: ${c}`)},
  addop:d=>{ui.moneyType=d.t;openSheet(()=>head('Новая операция')+opForm(null))},
  mtype:d=>{ui.moneyType=d.t;renderSheet()},
  pickcat:d=>{const i=$('#of-cat');if(i)i.value=d.c;const n=$('#of-note');if(n){n.placeholder=d.c===OTHER?'На что именно — обязательно':'';if(d.c===OTHER)n.focus()}},
  editop:d=>openSheet(()=>{const o=S.finance.entries.find(e=>e.id===d.id);return o?head(o.type==='income'?'Доход':'Расход')+opForm(o):null}),
  delop:(d,el)=>{if(!arm(el))return;S.finance.entries=S.finance.entries.filter(e=>e.id!==d.id);closeSheet();commit('Операция удалена')},
  plan:()=>openSheet(planSheet),
  settings:()=>openSheet(settingsSheet),
  delsphere:d=>{S.spheres=S.spheres.filter(s=>s.id!==d.id);commit()},
  newmonth:()=>{closeAll();openSheet(newMonthSheet)},
  wipe:(d,el)=>{if(!arm(el,'Удалятся цели, задачи и финансы. Нажмите ещё раз'))return;S=emptyState();ui.day=null;closeAll();commit('Всё очищено')},
};
const F={
  task:(fd,f)=>{
    const id=f.dataset.id;
    const data={title:fd.get('title').trim(),date:fd.get('date'),time:fd.get('time')||'',keyTaskId:fd.get('link')||null};
    if(id){const s=subById(id);if(data.date!==s.date)moveSub(s,data.date);Object.assign(s,data);closeSheet();commit('Сохранено');return}
    const checks=(fd.get('checks')||'').split('\n').map(x=>x.trim()).filter(Boolean).map(text=>({id:uid(),text,done:false}));
    S.subtasks.push({id:uid(),...data,done:false,moves:0,checks});
    closeSheet();commit('Добавлено на '+dShort(data.date));
  },
  key:(fd,f)=>{
    const id=f.dataset.id,data={title:fd.get('title').trim(),due:fd.get('due')||''};
    if(id)Object.assign(keyById(id),data);else S.keyTasks.push({id:uid(),goalId:f.dataset.g,...data,done:false});
    closeSheet();commit(id?'Сохранено':'Шаг добавлен');
  },
  goal:(fd,f)=>{
    const id=f.dataset.id,data={title:fd.get('title').trim(),sphereId:fd.get('sphereId')||''};
    if(id){Object.assign(goalById(id),data);closeSheet();commit('Сохранено');return}
    const g={id:uid(),...data,done:false};S.goals.push(g);
    closeSheet();commit('Цель добавлена');openSheet(goalSheet(g.id));
  },
  event:(fd,f)=>{
    const id=f.dataset.id,data={title:fd.get('title').trim(),date:fd.get('date'),time:fd.get('time')||'',goalId:fd.get('goalId')||''};
    if(id)Object.assign(S.events.find(e=>e.id===id),data);else S.events.push({id:uid(),...data});
    closeSheet();commit(id?'Сохранено':'Событие добавлено');
  },
  op:(fd,f)=>{
    const id=f.dataset.id,amount=Math.abs(parseFloat(String(fd.get('amount')).replace(',','.')));
    if(!amount){toast('Введите сумму');return}
    const data={amount,category:fd.get('category').trim()||OTHER,date:fd.get('date'),note:fd.get('note').trim()};
    if(data.category===OTHER&&!data.note){toast('Для «Остальное» напишите комментарий');$('#of-note')?.focus();return}
    if(id)Object.assign(S.finance.entries.find(e=>e.id===id),data);
    else S.finance.entries.push({id:uid(),type:f.dataset.t,ts:Date.now(),...data});
    ui.finYm=data.date.slice(0,7);
    closeSheet();commit(id?'Сохранено':(f.dataset.t==='income'?'Доход записан':'Расход записан'));
  },
  plan:fd=>{const ym=ui.finYm;const i=+fd.get('income')||0,e=+fd.get('expense')||0;if(i||e)S.finance.plans[ym]={income:i,expense:e};else delete S.finance.plans[ym];closeSheet();commit('План сохранён')},
  check:(fd,f)=>{const s=subById(f.dataset.id);s.checks=s.checks||[];s.checks.push({id:uid(),text:fd.get('text').trim(),done:false});commit()},
  move:(fd,f)=>{const d=fd.get('date');moveSub(subById(f.dataset.id),d);closeSheet();commit('Перенесено на '+dShort(d))},
  settings:fd=>{S.month.focus=fd.get('focus').trim();S.finance.currency=fd.get('currency').trim();closeSheet();commit('Сохранено')},
  sphere:fd=>{const n=fd.get('name').trim();if(n&&!S.spheres.some(s=>s.name===n))S.spheres.push({id:uid(),name:n,color:SPHERE_COLORS[S.spheres.length%SPHERE_COLORS.length]});commit('Сфера добавлена')},
  newmonth:fd=>{
    const [start,end]=monthBounds(fd.get('month'));
    const carry=fd.get('carry')?S.subtasks.filter(s=>!s.done).map(s=>({...s,keyTaskId:null,date:start,moves:0})):[];
    S.month={start,end,focus:''};S.goals=[];S.keyTasks=[];S.subtasks=carry;S.events=S.events.filter(e=>e.date>=start);
    ui.day=null;closeAll();location.hash='month';commit('Новый месяц начат');
  },
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const fn=A[el.dataset.a];if(!fn)return;
  e.preventDefault();fn(el.dataset,el,e);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();
  F[f.dataset.f]?.(new FormData(f),f);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stack.length)closeSheet()});
window.addEventListener('hashchange',()=>{readHash();render();window.scrollTo(0,0)});

readHash();render();initStore();
</script>
